services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env        # optional: copy .env.example to .env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      - ragdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  ragdata:
